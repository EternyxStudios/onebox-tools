<section class="hero"><h1>Study Timer</h1><p>Run a simple countdown study timer in your browser.</p></section><section class="card"><label>Minutes</label><input id="m" type="number" min="1" value="25"><div class="row"><button class="primary" onclick="start()">Start</button><button class="primary" onclick="stop()">Stop</button></div><div id="o" class="result">25:00</div></section><script>let id,left=1500;function draw(){o.textContent=`${String(Math.floor(left/60)).padStart(2,'0')}:${String(left%60).padStart(2,'0')}`}function start(){clearInterval(id);left=Math.max(1,+m.value)*60;draw();id=setInterval(()=>{left--;draw();if(left<=0){clearInterval(id);o.textContent='Time complete!'}},1000)}function stop(){clearInterval(id)}</script>
