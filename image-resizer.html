<link rel="stylesheet" href="seo-tools-2.css"></head><body><div class="wrap">
<header class="top"><a class="brand" href="./">ONEBOX</a><a class="back" href="./">← All Tools</a></header>
<section class="hero"><h1>Image Resizer</h1><p>Resize an image to custom width and height directly in your browser.</p></section><section class="card"><div class="filebox"><input id="f" type="file" accept="image/*"></div><div class="grid"><div><label>Width (px)</label><input id="w" type="number" value="800"></div><div><label>Height (px)</label><input id="h" type="number" value="600"></div></div><button class="primary" onclick="go()">Resize</button><div id="o" class="result">Select an image.</div><img id="p" class="preview" style="display:none"><a id="dl" class="back" style="display:none;margin-top:12px" download="resized-image.png">Download image</a></section>
<script>function go(){let f=document.getElementById('f').files[0];if(!f)return;let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let u=c.toDataURL('image/png');p.src=u;p.style.display='block';dl.href=u;dl.style.display='inline-block';o.textContent=`New size: ${c.width} × ${c.height}px`};im.src=URL.createObjectURL(f)}</script>
<section class="card content"><h2>About this tool</h2><p>The image is resized in the browser using a canvas and can then be downloaded as PNG.</p></section>
